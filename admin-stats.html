<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>방문자 통계 | 더수원 관리자</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/layout.css" />

  <style>
    body {
      margin: 0;
      font-family: Pretendard, "Noto Sans KR", sans-serif;
      background: #f7f4ed;
      color: #2f332d;
    }

    .admin-page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 110px 20px 80px;
    }

    .admin-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    .admin-head h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #263325;
    }

    .admin-head p {
      margin: 0;
      color: #666;
      line-height: 1.6;
    }

    .logout-btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #2e7d32;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-box {
      background: #fff;
      border: 1px solid #e5ddcf;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 26px rgba(60, 50, 35, 0.06);
    }

    .filter-title {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 900;
      color: #263325;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .date-input {
      height: 42px;
      padding: 0 12px;
      border: 1px solid #d8d0c2;
      border-radius: 12px;
      font-size: 14px;
      background: #fffdf8;
    }

    .filter-btn {
      height: 42px;
      padding: 0 14px;
      border: 1px solid #d8d0c2;
      border-radius: 999px;
      background: #fff;
      color: #444;
      font-weight: 800;
      cursor: pointer;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #2e7d32;
      border-color: #2e7d32;
      color: #fff;
    }

    .selected-period {
      margin: 12px 0 0;
      color: #777;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #e5ddcf;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 26px rgba(60, 50, 35, 0.06);
    }

    .stat-label {
      margin: 0 0 10px;
      color: #777;
      font-size: 14px;
      font-weight: 700;
    }

    .stat-value {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      color: #2e7d32;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      background: #fff;
      border: 1px solid #e5ddcf;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 26px rgba(60, 50, 35, 0.06);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #263325;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .list-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee8dd;
      font-size: 14px;
    }

    .list-row:last-child {
      border-bottom: 0;
    }

    .list-main {
      color: #333;
      word-break: break-all;
    }

    .list-sub {
      color: #888;
      font-size: 12.5px;
      margin-top: 4px;
    }

    .list-count {
      font-weight: 900;
      color: #2e7d32;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      font-size: 14px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee8dd;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #666;
      font-size: 13px;
      background: #fbf8f1;
    }

    td {
      color: #333;
    }

    .muted {
      color: #999;
    }

    .loading {
      padding: 40px 0;
      text-align: center;
      color: #777;
    }

    @media (max-width: 900px) {
      .stats-grid,
      .section-grid {
        grid-template-columns: 1fr 1fr;
      }

      .admin-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 560px) {
      .admin-page {
        padding: 95px 14px 60px;
      }

      .stats-grid,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .admin-head h1 {
        font-size: 26px;
      }

      .date-input,
      .filter-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="admin-page">
    <section class="admin-head">
      <div>
        <h1>방문자 통계</h1>
        <p>날짜별로 방문 기록과 상담 버튼 클릭 현황을 확인합니다.</p>
      </div>

      <button id="logoutBtn" class="logout-btn" type="button">
        로그아웃
      </button>
    </section>

    <section class="filter-box">
      <p class="filter-title">조회 기간 선택</p>

      <div class="filter-row">
        <button class="filter-btn active" type="button" data-range="today">오늘</button>
        <button class="filter-btn" type="button" data-range="yesterday">어제</button>
        <button class="filter-btn" type="button" data-range="7days">최근 7일</button>
        <button class="filter-btn" type="button" data-range="30days">최근 30일</button>

        <input id="startDate" class="date-input" type="date" />
        <span>~</span>
        <input id="endDate" class="date-input" type="date" />

        <button id="applyDateBtn" class="filter-btn" type="button">조회</button>
      </div>

      <p id="selectedPeriod" class="selected-period">오늘 통계를 보고 있습니다.</p>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <p class="stat-label">선택 기간 방문</p>
        <p id="periodVisits" class="stat-value">-</p>
      </div>

      <div class="stat-card">
        <p class="stat-label">전체 방문</p>
        <p id="totalVisits" class="stat-value">-</p>
      </div>

      <div class="stat-card">
        <p class="stat-label">선택 기간 전화 클릭</p>
        <p id="phoneClicks" class="stat-value">-</p>
      </div>

      <div class="stat-card">
        <p class="stat-label">선택 기간 전체 클릭</p>
        <p id="totalClicks" class="stat-value">-</p>
      </div>
    </section>

    <section class="section-grid">
      <div class="panel">
        <h2>유입 경로</h2>
        <div id="sourceList" class="list">
          <div class="loading">불러오는 중...</div>
        </div>
      </div>

      <div class="panel">
        <h2>클릭 종류</h2>
        <div id="clickList" class="list">
          <div class="loading">불러오는 중...</div>
        </div>
      </div>

      <div class="panel">
        <h2>기기 종류</h2>
        <div id="deviceList" class="list">
          <div class="loading">불러오는 중...</div>
        </div>
      </div>

      <div class="panel">
        <h2>브라우저</h2>
        <div id="browserList" class="list">
          <div class="loading">불러오는 중...</div>
        </div>
      </div>
    </section>

    <section class="panel" style="margin-top:18px;">
      <h2>선택 기간 방문 기록</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>방문 일시</th>
              <th>방문 페이지</th>
              <th>유입</th>
              <th>기기</th>
              <th>브라우저</th>
            </tr>
          </thead>
          <tbody id="recentVisits">
            <tr>
              <td colspan="5" class="loading">불러오는 중...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://lfnreutlwezdkpzqgqfi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_teQk9TxtVO_LNoA4Kww9ZA_9MBi3eSV";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const periodVisitsEl = document.getElementById("periodVisits");
    const totalVisitsEl = document.getElementById("totalVisits");
    const phoneClicksEl = document.getElementById("phoneClicks");
    const totalClicksEl = document.getElementById("totalClicks");

    const sourceListEl = document.getElementById("sourceList");
    const clickListEl = document.getElementById("clickList");
    const deviceListEl = document.getElementById("deviceList");
    const browserListEl = document.getElementById("browserList");
    const recentVisitsEl = document.getElementById("recentVisits");

    const logoutBtn = document.getElementById("logoutBtn");
    const startDateInput = document.getElementById("startDate");
    const endDateInput = document.getElementById("endDate");
    const applyDateBtn = document.getElementById("applyDateBtn");
    const selectedPeriodEl = document.getElementById("selectedPeriod");
    const rangeButtons = document.querySelectorAll("[data-range]");

    function toDateInputValue(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getDayStart(dateValue) {
      return new Date(`${dateValue}T00:00:00`);
    }

    function getNextDayStart(dateValue) {
      const date = getDayStart(dateValue);
      date.setDate(date.getDate() + 1);
      return date;
    }

    function setDateRange(type) {
      const today = new Date();
      let start = new Date(today);
      let end = new Date(today);

      if (type === "yesterday") {
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
        selectedPeriodEl.textContent = "어제 통계를 보고 있습니다.";
      }

      if (type === "today") {
        selectedPeriodEl.textContent = "오늘 통계를 보고 있습니다.";
      }

      if (type === "7days") {
        start.setDate(today.getDate() - 6);
        selectedPeriodEl.textContent = "최근 7일 통계를 보고 있습니다.";
      }

      if (type === "30days") {
        start.setDate(today.getDate() - 29);
        selectedPeriodEl.textContent = "최근 30일 통계를 보고 있습니다.";
      }

      startDateInput.value = toDateInputValue(start);
      endDateInput.value = toDateInputValue(end);

      loadStats();
    }

    function getSelectedRangeISO() {
      const startValue = startDateInput.value;
      const endValue = endDateInput.value;

      const start = getDayStart(startValue);
      const endExclusive = getNextDayStart(endValue);

      return {
        startISO: start.toISOString(),
        endISO: endExclusive.toISOString()
      };
    }

    function formatDate(value) {
      if (!value) return "-";

      return new Date(value).toLocaleString("ko-KR", {
        year: "2-digit",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getSourceLabel(row) {
      if (row.utm_source) {
        const sourceMap = {
          instagram: "인스타그램",
          daangn: "당근",
          kakao: "카카오톡",
          naverblog: "네이버 블로그",
          navermap: "네이버 지도",
          kakaomap: "카카오맵",
          google: "구글",
          naver: "네이버"
        };

        return sourceMap[row.utm_source] || row.utm_source;
      }

      if (row.referrer) {
        try {
          const host = new URL(row.referrer).hostname;

          if (host.includes("instagram")) return "인스타그램";
          if (host.includes("daangn")) return "당근";
          if (host.includes("kakao")) return "카카오";
          if (host.includes("map.naver")) return "네이버 지도";
          if (host.includes("blog.naver")) return "네이버 블로그";
          if (host.includes("naver")) return "네이버";
          if (host.includes("google")) return "구글";

          return host;
        } catch {
          return "외부 유입";
        }
      }

      return "직접 방문";
    }

    function countBy(rows, getter) {
      const map = {};

      rows.forEach(function (row) {
        const key = getter(row) || "알 수 없음";
        map[key] = (map[key] || 0) + 1;
      });

      return Object.entries(map).sort(function (a, b) {
        return b[1] - a[1];
      });
    }

    function renderList(el, entries) {
      if (!entries.length) {
        el.innerHTML = `<div class="muted">선택한 기간의 데이터가 없습니다.</div>`;
        return;
      }

      el.innerHTML = entries.slice(0, 10).map(function ([name, count]) {
        return `
          <div class="list-row">
            <div class="list-main">${name}</div>
            <div class="list-count">${count}</div>
          </div>
        `;
      }).join("");
    }

    function renderRecentVisits(rows) {
      if (!rows.length) {
        recentVisitsEl.innerHTML = `
          <tr>
            <td colspan="5" class="muted">선택한 기간의 방문 기록이 없습니다.</td>
          </tr>
        `;
        return;
      }

      recentVisitsEl.innerHTML = rows.map(function (row) {
        return `
          <tr>
            <td>${formatDate(row.created_at)}</td>
            <td>
              <div>${row.page_title || "-"}</div>
              <div class="list-sub">${row.page_url || "-"}</div>
            </td>
            <td>${getSourceLabel(row)}</td>
            <td>${row.device_type || "-"}</td>
            <td>${row.browser || "-"}</td>
          </tr>
        `;
      }).join("");
    }

    async function requireLogin() {
      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        window.location.href = "/admin-login.html";
        return false;
      }

      return true;
    }

    async function getCount(tableName, filterCallback) {
      let query = supabaseClient
        .from(tableName)
        .select("*", { count: "exact", head: true });

      if (filterCallback) {
        query = filterCallback(query);
      }

      const { count, error } = await query;

      if (error) {
        console.warn(error);
        return 0;
      }

      return count || 0;
    }

    async function loadStats() {
      const isLoggedIn = await requireLogin();
      if (!isLoggedIn) return;

      const { startISO, endISO } = getSelectedRangeISO();

      const totalVisits = await getCount("visits");

      const periodVisits = await getCount("visits", function (query) {
        return query.gte("created_at", startISO).lt("created_at", endISO);
      });

      const totalClicks = await getCount("click_events", function (query) {
        return query.gte("created_at", startISO).lt("created_at", endISO);
      });

      const phoneClicks = await getCount("click_events", function (query) {
        return query
          .gte("created_at", startISO)
          .lt("created_at", endISO)
          .in("event_type", ["phone_click", "footer_phone_click"]);
      });

      totalVisitsEl.textContent = totalVisits;
      periodVisitsEl.textContent = periodVisits;
      totalClicksEl.textContent = totalClicks;
      phoneClicksEl.textContent = phoneClicks;

      const { data: visits, error: visitsError } = await supabaseClient
        .from("visits")
        .select("*")
        .gte("created_at", startISO)
        .lt("created_at", endISO)
        .order("created_at", { ascending: false })
        .limit(500);

      const { data: clicks, error: clicksError } = await supabaseClient
        .from("click_events")
        .select("*")
        .gte("created_at", startISO)
        .lt("created_at", endISO)
        .order("created_at", { ascending: false })
        .limit(500);

      if (visitsError || clicksError) {
        sourceListEl.innerHTML = `<div class="muted">통계를 불러오지 못했습니다. SELECT 정책을 확인해주세요.</div>`;
        clickListEl.innerHTML = `<div class="muted">통계를 불러오지 못했습니다.</div>`;
        deviceListEl.innerHTML = `<div class="muted">통계를 불러오지 못했습니다.</div>`;
        browserListEl.innerHTML = `<div class="muted">통계를 불러오지 못했습니다.</div>`;
        return;
      }

      renderList(sourceListEl, countBy(visits || [], getSourceLabel));

      renderList(deviceListEl, countBy(visits || [], function (row) {
        return row.device_type;
      }));

      renderList(browserListEl, countBy(visits || [], function (row) {
        return row.browser;
      }));

      renderList(clickListEl, countBy(clicks || [], function (row) {
        return row.event_type;
      }));

      renderRecentVisits((visits || []).slice(0, 50));
    }

    rangeButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        rangeButtons.forEach(function (btn) {
          btn.classList.remove("active");
        });

        button.classList.add("active");
        setDateRange(button.dataset.range);
      });
    });

    applyDateBtn.addEventListener("click", function () {
      rangeButtons.forEach(function (btn) {
        btn.classList.remove("active");
      });

      selectedPeriodEl.textContent = `${startDateInput.value} ~ ${endDateInput.value} 통계를 보고 있습니다.`;
      loadStats();
    });

    logoutBtn.addEventListener("click", async function () {
      await supabaseClient.auth.signOut();
      window.location.href = "/admin-login.html";
    });

    setDateRange("today");
  </script>
</body>
</html>
