<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 | 더수원</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/layout.css?v=20260503">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'Noto Sans KR',sans-serif}
    body{
      min-height:100vh;
      color:#2b2b2b;
      background:
        radial-gradient(circle at 14% 12%,rgba(58,106,75,.10),transparent 26%),
        radial-gradient(circle at 86% 80%,rgba(58,106,75,.08),transparent 24%),
        linear-gradient(180deg,#f7f2e9 0%,#eee7dc 100%);
    }

    .admin-login-main{
      width:100%;
      max-width:560px;
      margin:0 auto;
      padding:84px 20px 110px;
    }

    .admin-login-card{
      position:relative;
      overflow:hidden;
      padding:34px;
      border:1px solid rgba(255,255,255,.72);
      border-radius:26px;
      background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.52));
      box-shadow:0 28px 70px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
    }

    .admin-login-card::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      right:-100px;
      top:-120px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(58,106,75,.14),transparent 70%);
      pointer-events:none;
    }

    .admin-eyebrow{
      position:relative;
      z-index:1;
      margin:0 0 10px;
      color:#3a6a4b;
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .admin-title{
      position:relative;
      z-index:1;
      margin:0;
      color:#26352c;
      font-size:32px;
      line-height:1.25;
      letter-spacing:-.045em;
    }

    .admin-copy{
      position:relative;
      z-index:1;
      margin:13px 0 26px;
      color:#666d68;
      font-size:14px;
      line-height:1.75;
      font-weight:600;
    }

    .field{
      position:relative;
      z-index:1;
      display:grid;
      gap:7px;
      margin-bottom:16px;
    }

    .field label{
      font-size:13px;
      font-weight:800;
      color:#333a36;
    }

    .field input{
      width:100%;
      min-height:48px;
      padding:10px 13px;
      border:1px solid #d8d0c5;
      border-radius:11px;
      background:#fff;
      color:#222;
      font:inherit;
      outline:none;
    }

    .field input:focus{
      border-color:rgba(58,106,75,.55);
      box-shadow:0 0 0 3px rgba(58,106,75,.10);
    }

    .login-button,
    .manage-link{
      position:relative;
      z-index:1;
      width:100%;
      min-height:48px;
      border:0;
      border-radius:12px;
      background:linear-gradient(145deg,#4b7d5c,#2f5a40);
      color:#fff;
      font:inherit;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 12px 24px rgba(47,90,64,.20);
    }

    .login-button:disabled{opacity:.55;cursor:wait}
    .manage-link[hidden]{display:none}

    .login-status{
      position:relative;
      z-index:1;
      min-height:24px;
      margin:14px 0 0;
      color:#2f5a40;
      font-size:13px;
      line-height:1.6;
      font-weight:700;
    }

    .admin-security{
      position:relative;
      z-index:1;
      margin:22px 0 0;
      padding-top:18px;
      border-top:1px solid rgba(43,43,43,.08);
      color:#7a7771;
      font-size:12px;
      line-height:1.65;
    }

    body.theme-night{
      color:#f7edf1;
      background:
        radial-gradient(circle at 16% 10%,rgba(241,182,109,.10),transparent 26%),
        radial-gradient(circle at 85% 80%,rgba(217,120,145,.12),transparent 24%),
        linear-gradient(180deg,#241f43,#15132e);
    }

    body.theme-night .admin-login-card{
      background:linear-gradient(145deg,rgba(61,45,84,.96),rgba(26,23,56,.94));
      border-color:rgba(255,225,211,.15);
      box-shadow:0 28px 70px rgba(5,4,18,.38),inset 0 1px 0 rgba(255,255,255,.07);
    }

    body.theme-night .admin-title{color:#ffe7c1}
    body.theme-night .admin-copy,
    body.theme-night .admin-security{color:#d8cbd8}
    body.theme-night .admin-eyebrow,
    body.theme-night .login-status{color:#f1b66d}
    body.theme-night .field label{color:#f5e8dc}
    body.theme-night .field input{
      border-color:rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      color:#fff;
    }

    .admin-login-page .nav-admin-login{display:none !important}

    @media(max-width:700px){
      .admin-login-main{padding:44px 12px 80px}
      .admin-login-card{padding:24px 18px;border-radius:20px}
      .admin-title{font-size:27px}
    }
  </style>
</head>
<body class="admin-login-page">
  <div id="site-header"></div>

  <main class="admin-login-main">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <p class="admin-eyebrow">THE SUWON ADMIN</p>
      <h1 class="admin-title" id="admin-login-title">관리자 로그인</h1>
      <p class="admin-copy">
        영상 등록·수정·삭제 기능은 관리자 계정으로 로그인한 뒤 이용할 수 있습니다.
      </p>

      <form id="adminLoginForm">
        <div class="field">
          <label for="adminEmail">이메일</label>
          <input id="adminEmail" type="email" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="adminPassword">비밀번호</label>
          <input id="adminPassword" type="password" autocomplete="current-password" required>
        </div>

        <button class="login-button" id="adminLoginButton" type="submit">로그인</button>
        <p class="login-status" id="adminLoginStatus" role="status"></p>
      </form>

      <a class="manage-link" id="manageLink" href="/영상소식.html?admin=1" hidden>
        영상 관리로 이동
      </a>

      <p class="admin-security">
        관리자 인증은 Supabase 계정과 RLS 권한으로 확인합니다.
        비밀번호는 홈페이지 코드에 저장되지 않습니다.
      </p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/layout.js?v=20260906"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/video-config.js"></script>
  <script>
    (() => {
      'use strict';

      const config = window.THE_SUWON_VIDEO_CONFIG || {};
      const configured = Boolean(
        config.supabaseUrl &&
        config.supabaseAnonKey &&
        config.adminUserId &&
        !String(config.supabaseUrl).includes('YOUR_') &&
        !String(config.supabaseAnonKey).includes('YOUR_') &&
        !String(config.adminUserId).includes('YOUR_')
      );

      const form = document.getElementById('adminLoginForm');
      const button = document.getElementById('adminLoginButton');
      const status = document.getElementById('adminLoginStatus');
      const manageLink = document.getElementById('manageLink');

      if (!configured || !window.supabase) {
        status.textContent = '관리자 연결 설정을 확인해 주세요.';
        button.disabled = true;
        return;
      }

      const db = window.supabase.createClient(
        config.supabaseUrl,
        config.supabaseAnonKey
      );

      function isAdmin(session) {
        return Boolean(
          session?.user?.id &&
          session.user.id === config.adminUserId
        );
      }

      async function showExistingSession() {
        const { data: { session } } = await db.auth.getSession();

        if (isAdmin(session)) {
          form.hidden = true;
          manageLink.hidden = false;
          status.textContent = '이미 관리자 계정으로 로그인되어 있습니다.';
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        button.disabled = true;
        status.textContent = '로그인 중입니다…';

        const { data, error } = await db.auth.signInWithPassword({
          email: document.getElementById('adminEmail').value.trim(),
          password: document.getElementById('adminPassword').value
        });

        if (error) {
          status.textContent = '이메일 또는 비밀번호를 확인해 주세요.';
          button.disabled = false;
          return;
        }

        if (!isAdmin(data.session)) {
          await db.auth.signOut();
          status.textContent = '관리자 권한이 없는 계정입니다.';
          button.disabled = false;
          return;
        }

        status.textContent = '로그인되었습니다. 영상 관리 화면으로 이동합니다…';

        setTimeout(() => {
          window.location.href = '/영상소식.html?admin=1';
        }, 350);
      });

      showExistingSession();
    })();
  </script>
</body>
</html>
