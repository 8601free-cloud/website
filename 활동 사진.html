<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개발 중 | 더수원</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="layout.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #f6fbf7;
      color: #1f2d24;
      overflow-x: hidden;
    }

    .dev-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }

    .dev-card {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 28px;
      padding: 56px 36px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(46, 125, 50, 0.12);
      border: 1px solid rgba(129, 199, 132, 0.35);
    }

    .dev-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #81c784, #388e3c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(56, 142, 60, 0.22);
    }

    .dev-card h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #1b5e20;
      word-break: keep-all;
    }

    .dev-card p {
      margin: 0;
      font-size: clamp(16px, 2.2vw, 20px);
      line-height: 1.7;
      color: #52645a;
      word-break: keep-all;
    }

    .dev-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 32px;
      min-height: 50px;
      padding: 0 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #81c784, #388e3c);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(56, 142, 60, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dev-home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(56, 142, 60, 0.24);
    }

    @media (max-width: 768px) {
      .dev-page {
        min-height: calc(100vh - 120px);
        padding: 56px 16px;
      }

      .dev-card {
        border-radius: 24px;
        padding: 44px 22px;
      }

      .dev-icon {
        width: 66px;
        height: 66px;
        font-size: 32px;
        margin-bottom: 20px;
      }

      .dev-card h1 {
        font-size: 28px;
      }

      .dev-card p {
        font-size: 16px;
      }

      .dev-home-btn {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="dev-page">
    <section class="dev-card" aria-label="개발 중 안내">
      <div class="dev-icon">🛠️</div>
      <h1>이 페이지는 현재 개발 중입니다.</h1>
      <p>
        더 나은 서비스 안내를 위해<br>
        페이지를 준비하고 있습니다.
      </p>
      <a href="index.html" class="dev-home-btn">홈으로 돌아가기</a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="layout.js"></script>
</body>
</html>
